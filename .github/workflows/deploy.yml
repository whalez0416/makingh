name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 관리자·API 는 서버가 있어야 도는 라우트라 정적 빌드에서 잠깐 빼둔다 (scripts/build-pages.mjs)
      - run: npm run build:pages
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
        with:
          enablement: true # 저장소에 Pages 가 꺼져 있으면 켠다 — 최초 설정 클릭 불필요
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
